packages:
  - 'packages/*'
  - 'apps/*'
  - 'tools/*'

overrides:
  minimatch: '>=10.2.3'
  '@isaacs/brace-expansion': '>=5.0.11'
  brace-expansion: '>=5.0.11'
  handlebars: '>=4.7.10'
  '@babel/plugin-transform-modules-systemjs': '^7.29.4'
  fast-uri: '>=3.1.7'
  proxy-addr: '>=2.0.8'
  tinypool: '>=2.1.2'
  source-map-js: '>=1.2.2'
  rollup: '>=4.59.0'
  ws: '>=8.21.0'
  picomatch: '>=4.0.4'
  browserslist: '>=4.28.7'
  vite: '^6.4.4'
  launch-editor: '>=2.14.2'
  # Fastify 5 resolves find-my-way 9.x; 9.7.0 fixes GHSA-c96f-x56v-gq3h.
  find-my-way: '>=9.7.0'

peerDependencyRules:
  allowedVersions:
    # @ts-rest/fastify@3.52.1 peers on Fastify 4. There is no stable Fastify 5 release.
    '@ts-rest/fastify>fastify': '5'

auditConfig:
  ignoreGhsas:
    # braces 3.0.3 is still the latest npm release. GHSA-vfj7-8cjw-p6xm has no patched version
    # (withdrawn 2026-10-23 as not practically exploitable). Kept so a republish does not fail audit.
    - GHSA-vfj7-8cjw-p6xm
    # Every zod below 4.6.6 is affected. Zod 3 has no patched release. Tracked by the Zod 4 upgrade (#207).
    - GHSA-mrhx-c7xc-m3w5

allowBuilds:
  '@sentry/cli': true
  bcrypt: true
  esbuild: true
  sharp: false
  unrs-resolver: true
